version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agency_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: client_project_feed
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d client_project_feed"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: agency_backend
    environment:
      PORT: 5001
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/client_project_feed?schema=public
      JWT_ACCESS_SECRET: super-secret-access-token-key-change-in-prod
      JWT_REFRESH_SECRET: super-secret-refresh-token-key-change-in-prod
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: "http://localhost"
    ports:
      - '5001:5001'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: agency_frontend
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
